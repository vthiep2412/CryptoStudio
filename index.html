<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>Crypto & Encoding Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- TODO: Consider pinning versions and updating SRI hashes periodically -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script type="module">
        import * as openpgp from 'https://cdn.jsdelivr.net/npm/openpgp@6.1.1/dist/openpgp.min.mjs';
        window.openpgp = openpgp;
        window.dispatchEvent(new CustomEvent('openpgp-ready'));
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>

<body class="bg-gray-950 text-gray-100 min-h-screen p-4 sm:p-8 flex flex-col items-center">

    <div class="max-w-6xl w-full flex flex-col flex-grow">
        <header class="mb-6 md:mb-8">
            <h1
                class="text-2xl md:text-3xl font-bold bg-gradient-to-r from-emerald-400 to-cyan-500 bg-clip-text text-transparent">
                Crypto Studio
            </h1>
            <p class="text-[var(--text-secondary)] mt-2 text-xs md:text-sm">Convert, Encode, and Encrypt strings locally in your
                browser.</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 md:gap-6 flex-grow">

            <!-- Input & Controls Section -->
            <div
                class="bg-[var(--bg-card)] border border-[var(--border-card)] rounded-xl p-4 md:p-5 shadow-xl flex flex-col gap-4 md:gap-5 h-full">

                <!-- Operation Type -->
                <div class="pill-container pill-container-3 w-full">
                    <div id="pillBg" class="pill-bg"></div>
                    <button id="btnEncoding" class="pill-btn active" onclick="setCategory('encoding')">Encoding</button>
                    <button id="btnEncryption" class="pill-btn" onclick="setCategory('encryption')">Encryption</button>
                    <button id="btnPGP" class="pill-btn" onclick="setCategory('pgp')">PGP</button>
                </div>

                <!-- Action & Algorithm Select -->
                <div id="controlsContainer" class="flex flex-col sm:flex-row gap-4">
                    <!-- Standard Action Area (Encoding/Encryption) -->
                    <div id="actionArea" class="flex-1 flex flex-col gap-2">
                        <label class="text-xs text-[var(--text-secondary)] font-semibold uppercase tracking-wider">Action</label>
                        <div class="flex gap-4 items-center h-10 px-2">
                            <label class="flex items-center gap-2 cursor-pointer group">
                                <input type="radio" name="action" value="process" checked class="sr-only peer">
                                <div
                                    class="w-4 h-4 rounded-full border-2 border-gray-500 peer-checked:border-emerald-500 peer-checked:border-[5px] transition-all duration-200">
                                </div>
                                <span id="labelProcess"
                                    class="text-sm text-[var(--text-secondary)] peer-checked:text-[var(--text-primary)] transition-colors">Encode</span>
                            </label>
                            <label class="flex items-center gap-2 cursor-pointer group">
                                <input type="radio" name="action" value="reverse" class="sr-only peer">
                                <div
                                    class="w-4 h-4 rounded-full border-2 border-gray-500 peer-checked:border-emerald-500 peer-checked:border-[5px] transition-all duration-200">
                                </div>
                                <span id="labelReverse"
                                    class="text-sm text-[var(--text-secondary)] peer-checked:text-[var(--text-primary)] transition-colors">Decode</span>
                            </label>
                        </div>
                    </div>

                    <div id="pgpActionArea" class="hidden flex-1 flex flex-col gap-2">
                        <label class="text-xs text-[var(--text-secondary)] font-semibold uppercase tracking-wider">Action</label>
                        <div class="pill-container pill-container-4 w-full">
                            <div id="pgpPillBg" class="pill-bg"></div>
                            <button class="pgp-switch-btn pill-btn active" onclick="setPgpAction('pgp-encrypt', 0)">Encrypt</button>
                            <button class="pgp-switch-btn pill-btn" onclick="setPgpAction('pgp-decrypt', 1)">Decrypt</button>
                            <button class="pgp-switch-btn pill-btn" onclick="setPgpAction('pgp-sign', 2)">Sign</button>
                            <button class="pgp-switch-btn pill-btn" onclick="setPgpAction('pgp-verify', 3)">Verify</button>
                        </div>
                    </div>
                    <div id="algoSelectContainer" class="flex-1 flex flex-col gap-2">
                        <label for="algorithmSelect"
                            class="text-xs text-[var(--text-secondary)] font-semibold uppercase tracking-wider">Algorithm</label>
                        <select id="algorithmSelect"
                            class="bg-[var(--bg-card-alt)] border border-[var(--border-card)] text-[var(--text-primary)] text-sm rounded-lg focus:ring-emerald-500 focus:border-emerald-500 block w-full p-2.5 outline-none transition-colors">
                            <!-- Populated by JS -->
                        </select>
                    </div>
                </div>

                <!-- Password/Key Input (Hidden by default) -->
                <div id="keyContainer" class="hidden flex-col gap-2">
                    <div class="flex justify-between items-center">
                        <label for="cryptoKey"
                            class="text-xs text-[var(--text-secondary)] font-semibold uppercase tracking-wider">Secret Key / PGP
                            Key</label>
                        <a id="genKeyLink" href="pgp-gen.html"
                            class="hidden text-xs text-emerald-400 hover:text-emerald-300 font-bold bg-emerald-400/10 px-4 py-2 rounded-lg border border-emerald-500/30 transition-all uppercase tracking-wider hover:bg-emerald-400/20">
                            Generate PGP Key
                        </a>
                    </div>
                    <textarea id="cryptoKey" placeholder="Enter your secret key or PGP armored key..."
                        class="bg-[var(--bg-card-alt)] border border-[var(--border-card)] text-[var(--text-primary)] text-sm rounded-lg focus:ring-emerald-500 focus:border-emerald-500 block w-full p-2.5 min-h-[80px] outline-none transition-colors custom-scrollbar resize-none"></textarea>

                    <!-- Enhance Protection Controls -->
                    <div id="protectionControls"
                        class="hidden mt-1 p-4 bg-[var(--bg-app)]/40 border border-[var(--border-card)] rounded-xl flex-col gap-3 transition-all">
                        <div class="flex justify-between items-center">
                            <label class="flex items-center gap-3 cursor-pointer group">
                                <div class="relative">
                                    <input type="checkbox" id="enhanceProtection" class="sr-only peer"
                                        onchange="toggleSecurityLevel()">
                                    <div
                                        class="w-9 h-5 bg-gray-700 rounded-full peer peer-checked:bg-emerald-600 after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:after:translate-x-full">
                                    </div>
                                </div>
                                <span
                                    class="text-xs text-[var(--text-secondary)] font-bold uppercase tracking-wider group-hover:text-emerald-400 transition-colors shrink-0">Enhance
                                    Protection</span>
                                <div class="relative group/tooltip inline-block">
                                    <div
                                        class="w-3.5 h-3.5 flex items-center justify-center rounded-full border border-gray-600 text-[10px] text-gray-500 group-hover/tooltip:border-emerald-500 group-hover/tooltip:text-emerald-500 cursor-help transition-all font-black">
                                        ?</div>
                                    <div
                                        class="absolute bottom-full left-1/2 -translate-x-1/2 mb-2 hidden group-hover/tooltip:block w-64 p-3 bg-[var(--bg-card)] border border-[var(--border-card)] rounded-lg shadow-2xl z-50 pointer-events-none">
                                        <p class="text-[10px] text-gray-300 leading-relaxed font-medium">
                                            <span class="text-emerald-400 font-bold block mb-1">Vault Mode Key
                                                Hardening</span>
                                            Adds customizable PBKDF2 iterations to protect against brute-force attacks.
                                            This hardening is unique to CryptoStudio. Manual configuration of salt and
                                            iterations is required for decryption on other platforms.
                                            <br>
                                            <span
                                                class="text-emerald-400 border-t border-[var(--border-card)] font-bold block mt-1">Iteration
                                                over
                                                levels:</span>
                                            <span
                                                class="block pt-2 text-[11px] text-[var(--text-secondary)] font-mono tracking-tight text-center">
                                                L1: 1 | L2: 10 | L3: 100 | L4: 1,000<br>
                                                L5: 10,000 | L6: 100k | L7: 1M
                                            </span>
                                        </p>
                                        <div
                                            class="absolute top-full left-1/2 -translate-x-1/2 -mt-1 border-4 border-transparent border-t-gray-800">
                                        </div>
                                    </div>
                                </div>
                            </label>
                            <div id="levelDisplay" class="hidden items-center gap-3">
                                <button onclick="adjustLevel(-1)"
                                    class="w-7 h-7 flex items-center justify-center bg-[var(--bg-card-alt)] border border-[var(--border-card)] rounded-md text-emerald-400 hover:bg-gray-700 transition-colors font-bold">-</button>
                                <span id="securityLevelDisplay"
                                    class="w-8 text-emerald-400 text-center text-sm font-black tabular-nums">5</span>
                                <button onclick="adjustLevel(1)"
                                    class="w-7 h-7 flex items-center justify-center bg-[var(--bg-card-alt)] border border-[var(--border-card)] rounded-md text-emerald-400 hover:bg-gray-700 transition-colors font-bold">+</button>
                            </div>
                        </div>

                        <div id="levelSliderContainer" class="hidden flex-col gap-2">
                            <input type="range" id="securitySlider" min="1" max="7" value="5" step="1"
                                class="w-full h-1.5 bg-[var(--bg-card-alt)] rounded-lg appearance-none cursor-pointer accent-emerald-500 overflow-hidden"
                                oninput="syncLevel(this.value)">
                            <div class="flex justify-between px-1">
                                <span class="text-[9px] text-[var(--text-dim)] font-bold">MIN</span>
                                <span class="text-[9px] text-[var(--text-dim)] font-bold">VAULT</span>
                            </div>
                            <div id="levelSpecs"
                                class="text-xs text-slate-500 font-mono italic leading-tight border-l-2 border-emerald-500/20 pl-3 mt-1">
                                <!-- Populated dynamically -->
                            </div>
                        </div>
                        <input type="hidden" id="securityLevel" value="5">
                    </div>
                </div>

                <!-- PGP Passphrase (PGP Specific) -->
                <div id="pgpPassContainer" class="hidden flex-col gap-2">
                    <label for="pgpPassphrase"
                        class="text-xs text-slate-500 font-semibold uppercase tracking-wider">PGP Passphrase</label>
                    <div class="relative">
                        <input type="password" id="pgpPassphrase" placeholder="Enter passphrase for private key..."
                            class="bg-[var(--bg-card-alt)] border border-[var(--border-card)] text-[var(--text-primary)] text-sm rounded-lg focus:ring-emerald-500 focus:border-emerald-500 block w-full p-2.5 pr-12 outline-none transition-colors">
                        <button id="pgpPassToggle" onclick="togglePgpPass()"
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-[var(--text-dim)] hover:text-emerald-400 transition-colors" title="Toggle Visibility"
                            aria-label="Toggle passphrase visibility">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                </div>

                <!-- Input Text -->
                <div class="flex flex-col gap-2 flex-grow">
                    <div class="flex justify-between items-end">
                        <label for="inputText"
                            class="text-xs text-[var(--text-secondary)] font-semibold uppercase tracking-wider">Input Text</label>
                        <button onclick="clearInput()"
                            class="text-xs text-[var(--text-dim)] hover:text-[var(--text-primary)] transition-colors">Clear</button>
                    </div>
                    <textarea id="inputText" placeholder="Type or paste your text here..."
                        class="bg-[var(--bg-card-alt)] custom-scrollbar border border-[var(--border-card)] text-[var(--text-primary)] text-sm rounded-lg focus:ring-emerald-500 focus:border-emerald-500 block w-full p-3 min-h-[150px] flex-grow outline-none resize-none transition-colors"></textarea>
                </div>
            </div>

            <!-- Output Section -->
            <div class="bg-[var(--bg-card)] border border-[var(--border-card)] rounded-xl p-4 md:p-5 shadow-xl flex flex-col gap-2 h-full">
                <div class="flex justify-between items-end mb-1 md:mb-3">
                    <label class="text-xs text-[var(--text-secondary)] font-semibold uppercase tracking-wider">Output Result</label>
                    <button onclick="copyOutput()"
                        class="flex items-center gap-1.5 text-xs bg-[var(--bg-card-alt)] hover:bg-gray-700 text-[var(--text-secondary)] py-1.5 px-3 rounded-md border border-[var(--border-card)] transition-colors">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                            xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z">
                            </path>
                        </svg>
                        Copy
                    </button>
                </div>

                <div id="outputArea"
                    class="bg-[var(--bg-app)] border border-[var(--border-card)] rounded-lg p-4 flex-grow min-h-[150px] md:min-h-[300px] overflow-auto custom-scrollbar font-mono text-sm text-[var(--text-secondary)] break-all whitespace-pre-wrap">
                </div>

                <!-- Recovery Area (Dynamic buttons) -->
                <div id="recoveryArea" class="hidden justify-end mt-2"></div>

                <!-- Toast Message -->
                <div id="toastMsg"
                    class="opacity-0 transition-opacity duration-300 text-xs text-emerald-400 text-center mt-2 h-4">
                    Copied to clipboard!
                </div>

                <!-- Live Status Indicator -->
                <div class="mt-4 flex justify-between items-center border-t border-[var(--border-card)] pt-4">
                    <span class="text-xs text-slate-500 uppercase font-bold tracking-widest">Engine Status</span>
                    <div id="statusText" class="text-xs text-slate-500 uppercase font-black tracking-widest">Idle</div>
                </div>
            </div>

        </div>

        <!-- Footer -->
        <footer
            class="mt-12 pb-4 text-center text-sm text-[var(--text-dim)] flex flex-col sm:flex-row justify-center items-center gap-4 border-t border-[var(--border-card)] pt-6">
            <div class="flex items-center gap-4 flex-wrap justify-center">
                <a href="https://github.com/vthiep2412/CryptoStudio" target="_blank" rel="noopener noreferrer"
                    class="hover:text-emerald-400 transition-colors flex items-center gap-1.5">
                    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path fill-rule="evenodd"
                            d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"
                            clip-rule="evenodd"></path>
                    </svg>
                    vthiep2412/CryptoStudio
                </a>
                <span class="hidden sm:inline text-gray-700">|</span>
                <a href="https://www.apache.org/licenses/LICENSE-2.0" target="_blank" rel="noopener noreferrer"
                    class="hover:text-emerald-400 transition-colors">
                    Apache 2.0
                </a>
                <span class="hidden sm:inline text-gray-700">|</span>
                <button id="themeToggle" onclick="toggleTheme(event)"
                    class="group w-10 h-10 flex items-center justify-center rounded-full bg-[var(--bg-card-alt)] border border-[var(--border-card)] hover:border-emerald-500 transition-all duration-300 shadow-lg"
                    title="Toggle Theme" aria-label="Toggle dark/light mode">
                    <svg id="sunIcon" class="hidden w-5 h-5 text-emerald-400" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
                    <svg id="moonIcon" class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                    </svg>
                </button>
            </div>
        </footer>

    </div>

    <script>
        // Data configurations
        const algorithms = {
            encoding: [
                { id: 'base64', name: 'Base64' },
                { id: 'base32', name: 'Base32' },
                { id: 'base58', name: 'Base58' },
                { id: 'hex', name: 'Hexadecimal' },
                { id: 'binary', name: 'Binary' },
                { id: 'uri', name: 'URI Component' }
            ],
            encryption: [
                { id: 'aes', name: 'AES' },
                { id: 'tripledes', name: 'TripleDES' },
                { id: 'rabbit', name: 'Rabbit' },
                { id: 'rc4', name: 'RC4' },
                { id: 'xor', name: 'XOR Cipher' }
            ],
            pgp: [
                { id: 'pgp-encrypt', name: 'PGP Encrypt' },
                { id: 'pgp-decrypt', name: 'PGP Decrypt' },
                { id: 'pgp-sign', name: 'PGP Sign' },
                { id: 'pgp-verify', name: 'PGP Verify' }
            ]
        };

        // State
        let currentCategory = 'encoding';
        let currentPgpAlgo = 'pgp-encrypt';

        // DOM Elements
        const btnEncoding = document.getElementById('btnEncoding');
        const btnEncryption = document.getElementById('btnEncryption');
        const btnPGP = document.getElementById('btnPGP');
        const actionArea = document.getElementById('actionArea');
        const pgpActionArea = document.getElementById('pgpActionArea');
        const pgpPillBg = document.getElementById('pgpPillBg');
        const labelProcess = document.getElementById('labelProcess');
        const labelReverse = document.getElementById('labelReverse');
        const algorithmSelect = document.getElementById('algorithmSelect');
        const algoSelectContainer = document.getElementById('algoSelectContainer');
        const keyContainer = document.getElementById('keyContainer');
        const cryptoKeyLabel = document.querySelector('label[for="cryptoKey"]');
        const pgpPassContainer = document.getElementById('pgpPassContainer');
        const genKeyLink = document.getElementById('genKeyLink');
        const inputText = document.getElementById('inputText');
        const cryptoKey = document.getElementById('cryptoKey');
        const pgpPassphraseInput = document.getElementById('pgpPassphrase');
        const outputArea = document.getElementById('outputArea');
        const recoveryArea = document.getElementById('recoveryArea');
        const toastMsg = document.getElementById('toastMsg');
        const radioActions = document.getElementsByName('action');
        const statusText = document.getElementById('statusText');

        const statusPhrases = [
            "Distilling logic",
            "Processing data",
            "Inhaling data",
            "Creating entropy",
            "Sifting chaos",
            "Refining noise",
            "Folding logic",
            "Parsing shadows"
        ];

        let statusAnimationInterval = null;
        let phraseCycleInterval = null;
        function setAnimatedStatus(target, onComplete) {
            if (statusAnimationInterval) clearInterval(statusAnimationInterval);
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#$@&";
            const current = statusText.innerText || "";
            const maxLength = Math.max(current.length, target.length);
            let iteration = 0;

            statusAnimationInterval = setInterval(() => {
                let display = "";
                let complete = true;

                for (let i = 0; i < maxLength; i++) {
                    const stagger = i * 2;
                    const lockTime = stagger + 8; // More frames of scrambling

                    if (iteration >= lockTime) {
                        display += target[i] || "";
                    } else if (iteration >= stagger) {
                        display += chars[Math.floor(Math.random() * chars.length)];
                        complete = false;
                    } else {
                        display += current[i] || "";
                        complete = false;
                    }
                }

                statusText.innerText = display;
                if (complete) {
                    clearInterval(statusAnimationInterval);
                    statusText.innerText = target;
                    if (onComplete) onComplete();
                }
                iteration++;
            }, 40);
        }

        function startStatusCycling() {
            if (phraseCycleInterval) clearTimeout(phraseCycleInterval);

            const update = () => {
                const phrase = statusPhrases[Math.floor(Math.random() * statusPhrases.length)];
                setAnimatedStatus(phrase, () => {
                    // Wait at least 0.5s after animation finishes before starting next one
                    phraseCycleInterval = setTimeout(update, 1000);
                });
            };

            update();
        }

        function stopStatusCycling(finalTarget) {
            if (phraseCycleInterval) {
                clearTimeout(phraseCycleInterval);
                phraseCycleInterval = null;
            }
            setAnimatedStatus(finalTarget);
        }

        // Performance: Pre-instantiate encoders
        const encoder = new TextEncoder();
        const decoder = new TextDecoder();

        // Utilities
        function debounce(func, wait) {
            let timeout;
            return function (...args) {
                clearTimeout(timeout);
                timeout = setTimeout(() => func.apply(this, args), wait);
            };
        }

        const debouncedExecute = debounce(executeTransformation, 300);

        // Initialization
        function init() {
            populateSelect();
            addEventListeners();
            setCategory('encoding');

            window.addEventListener('openpgp-ready', () => {
                btnPGP.disabled = false;
                btnPGP.classList.replace('text-gray-600', 'text-gray-400');
                btnPGP.classList.replace('cursor-not-allowed', 'hover:text-white');
            });

            // Check if already ready (rare race condition if module finishes very fast)
            if (window.openpgp) {
                window.dispatchEvent(new CustomEvent('openpgp-ready'));
            }
        }

        function setCategory(cat, save = true) {
            currentCategory = cat;
            if (save) localStorage.setItem('activeCategory', cat);
            const pill = document.getElementById('pillBg');

            // Update active states
            [btnEncoding, btnEncryption, btnPGP].forEach(b => b.classList.remove('active'));

            if (cat === 'encoding') {
                pill.style.setProperty('--pill-translate', '0%');
                btnEncoding.classList.add('active');
                labelProcess.textContent = "Encode";
                labelReverse.textContent = "Decode";
                keyContainer.classList.add('hidden');
                genKeyLink.classList.add('hidden');
                algoSelectContainer.classList.remove('hidden');
                actionArea.classList.remove('hidden');
                pgpActionArea.classList.add('hidden');
            } else if (cat === 'encryption') {
                pill.style.setProperty('--pill-translate', '100%');
                btnEncryption.classList.add('active');
                labelProcess.textContent = "Encrypt";
                labelReverse.textContent = "Decrypt";
                keyContainer.classList.remove('hidden');
                keyContainer.classList.add('flex');
                genKeyLink.classList.add('hidden');
                algoSelectContainer.classList.remove('hidden');
                actionArea.classList.remove('hidden');
                pgpActionArea.classList.add('hidden');
            } else {
                pill.style.setProperty('--pill-translate', '200%');
                btnPGP.classList.add('active');
                keyContainer.classList.remove('hidden');
                keyContainer.classList.add('flex');

        const Base32 = {
            chars: "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567",
            encode: function (text) {
                const bytes = encoder.encode(text);
                let bits = 0, value = 0, output = [];
                for (let i = 0; i < bytes.length; i++) {
                    value = (value << 8) | bytes[i];
                    bits += 8;
                    while (bits >= 5) {
                        output.push(this.chars[(value >>> (bits - 5)) & 31]);
                        bits -= 5;
                    }
                }
                if (bits > 0) output.push(this.chars[(value << (5 - bits)) & 31]);
                while ((output.length % 8) !== 0) output.push("=");
                return output.join('');
            },
            decode: function (encoded) {
                encoded = encoded.replace(/=+$/, "").toUpperCase();
                let bits = 0, value = 0, bytes = [];
                for (let i = 0; i < encoded.length; i++) {
                    const val = this.chars.indexOf(encoded[i]);
                    if (val === -1) throw new Error("Invalid Base32 character.");
                    value = (value << 5) | val;
                    bits += 5;
                    if (bits >= 8) {
                        bytes.push((value >>> (bits - 8)) & 255);
                        bits -= 8;
                    }
                }
                return decoder.decode(new Uint8Array(bytes));
            }
        };

        const Base58 = {
            chars: "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz",
            encode: function (text) {
                if (!text) return "";
                const bytes = Array.from(encoder.encode(text));
                const digits = [];
                for (const byte of bytes) {
                    let carry = byte;
                    for (let j = 0; j < digits.length; j++) {
                        carry += digits[j] << 8;
                        digits[j] = carry % 58;
                        carry = (carry / 58) | 0;
                    }
                    while (carry > 0) {
                        digits.push(carry % 58);
                        carry = (carry / 58) | 0;
                    }
                }
                let res = digits.reverse().map(d => this.chars[d]).join("");
                for (const byte of bytes) {
                    if (byte === 0) res = this.chars[0] + res;
                    else break;
                }
                return res;
            },
            decode: function (encoded) {
                if (!encoded) return "";
                const bytes = [];
                for (const char of encoded) {
                    let carry = this.chars.indexOf(char);
                    if (carry < 0) throw new Error("Invalid Base58 character.");
                    for (let j = 0; j < bytes.length; j++) {
                        carry += bytes[j] * 58;
                        bytes[j] = carry % 256;
                        carry = (carry / 256) | 0;
                    }
                    while (carry > 0) {
                        bytes.push(carry % 256);
                        carry = (carry / 256) | 0;
                    }
                }
                for (const char of encoded) {
                    if (char === this.chars[0]) bytes.push(0);
                    else break;
                }
                return decoder.decode(new Uint8Array(bytes.reverse()));
            }
        };

        // --- BACKGROUND WORKER (ZERO-LAG) ---
        // We embed the worker logic to prevent 404s on GitHub Pages sub-paths
        const workerCode = `
            try {
                importScripts('https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js');
            } catch (e) {
                self.postMessage({ error: 'Failed to load CryptoJS in worker: ' + e.message });
            }

            self.onmessage = function(e) {
                if (typeof CryptoJS === 'undefined') {
                    self.postMessage({ error: 'CryptoJS is not loaded in worker' });
                    return;
                }
                const { password, saltHex, keySize, ivSize, iterations } = e.data;
                try {
                    const salt = CryptoJS.enc.Hex.parse(saltHex);
                    const derived = CryptoJS.PBKDF2(password, salt, {
                        keySize: (keySize + ivSize) / 4,
                        iterations: iterations,
                        hasher: CryptoJS.algo.SHA256
                    });
                    self.postMessage({ derivedHex: derived.toString(CryptoJS.enc.Hex) });
                } catch (err) {
                    self.postMessage({ error: 'PBKDF2 derivation failed: ' + err.message });
                }
            };
        `;
 
        let activeWorker = null;
 
        const pbkdf2Derive = (passphrase, salt, keySize, ivSize, iterations) => {
            return new Promise((resolve, reject) => {
                const workerBlob = new Blob([workerCode], { type: 'application/javascript' });
                const workerUrl = URL.createObjectURL(workerBlob);

                // Terminate any existing worker to prevent concurrent CPU-heavy tasks
                if (activeWorker) {
                    activeWorker.terminate();
                    activeWorker = null;
                }

                let localWorker;
                try {
                    localWorker = new Worker(workerUrl);
                    activeWorker = localWorker;
                    URL.revokeObjectURL(workerUrl);
                } catch (e) {
                    URL.revokeObjectURL(workerUrl);
                    reject(new Error('Failed to instantiate worker: ' + e.message));
                    return;
                }

                const timeout = setTimeout(() => {
                    localWorker.terminate();
                    reject(new Error('PBKDF2 derivation timed out'));
                }, 30000); // 30s timeout for high iteration counts

                localWorker.onmessage = (e) => {
                    clearTimeout(timeout);
                    localWorker.terminate();
                    if (activeWorker === localWorker) activeWorker = null;
                    if (e.data.error) {
                        reject(new Error(e.data.error));
                    } else {
                        resolve(CryptoJS.enc.Hex.parse(e.data.derivedHex));
                    }
                };

                localWorker.onerror = (e) => {
                    clearTimeout(timeout);
                    localWorker.terminate();
                    if (activeWorker === localWorker) activeWorker = null;
                    // Build a detailed diagnostic message including location when available
                    const parts = [];
                    if (e && e.message) {
                        parts.push(e.message);
                    } else {
                        parts.push('The worker encountered an unhandled error or failed to initialize.');
                    }
                    const locationParts = [];
                    if (e && e.filename) {
                        locationParts.push(e.filename);
                    }
                    if (e && typeof e.lineno === 'number') {
                        locationParts.push('line ' + e.lineno);
                    }
                    if (e && typeof e.colno === 'number') {
                        locationParts.push('col ' + e.colno);
                    }
                    if (locationParts.length) {
                        parts.push('(' + locationParts.join(': ') + ')');
                    }
                    const msg = parts.join(' ');
                    reject(new Error('Worker runtime error: ' + msg));
                };

                localWorker.postMessage({
                    password: passphrase,
                    saltHex: salt.toString(CryptoJS.enc.Hex),
                    keySize,
                    ivSize,
                    iterations: iterations || 10000
                });
            });
        };

        async function resilientDecryption(input, passphrase, keySize, ivSize, decryptFn) {
            const clean = (str) => {
                // Remove all whitespace (newlines, spaces, tabs) which often get inserted when copying large chunks of text
                return str.replace(/\s+/g, '');
            };

            const t = clean(input);
            if (!t) throw new Error("Decryption failed. Please verify your input.");

            async function tryLevel(saltB64, ciphertext, lv) {
                try {
                    const iters = Math.pow(10, lv - 1);
                    const salt = CryptoJS.enc.Base64.parse(saltB64);
                    const derived = await pbkdf2Derive(passphrase, salt, keySize, ivSize, iters);
                    const key = CryptoJS.lib.WordArray.create(derived.words.slice(0, keySize / 4), keySize);
                    const iv = (ivSize > 0) ? CryptoJS.lib.WordArray.create(derived.words.slice(keySize / 4, (keySize + ivSize) / 4), ivSize) : null;
                    const options = iv ? { iv: iv } : {};
                    const dec = decryptFn(ciphertext, key, options).toString(CryptoJS.enc.Utf8);
                    return dec || null;
                } catch (e) { return null; }
            }

            // 1. Modern Prefix Detection (lvN:salt:cipher)
            const lvMatch = t.match(/^lv(\d):/);
            if (lvMatch) {
                const lv = parseInt(lvMatch[1]);
                const parts = t.substring(lvMatch[0].length).split(':');
                if (parts.length >= 2) {
                    const res = await tryLevel(parts[0], parts[1], lv);
                    if (res) return res;
                }
            }

            // 2. Automated Bruting (Level 1-5 + Compatibility Level 6)
            const parts = t.split(':');
            let saltPart = null, cipherPart = null;
            if (lvMatch && parts.length >= 3) {
                saltPart = parts[1];
                cipherPart = parts[2];
            } else if (!lvMatch && parts.length >= 2) {
                saltPart = parts[0];
                cipherPart = parts[1];
            }

            // Brute-force attempt: try user's selected level first, then all others for backward compatibility
            if (saltPart && cipherPart) {
                const selectedLv = parseInt(document.getElementById('securityLevel').value) || 5;
                const levels = [selectedLv, 5, 4, 3, 2, 1];
                const seen = new Set();
                for (const l of levels) {
                    if (seen.has(l)) continue;
                    seen.add(l);
                    const res = await tryLevel(saltPart, cipherPart, l);
                    if (res) return res;
                }
            }

            // 3. Raw Legacy Fallback
            try {
                const rawDec = decryptFn(t, passphrase).toString(CryptoJS.enc.Utf8);
                if (rawDec) return rawDec;
            } catch (e) { }

            throw new Error("Decryption failed. Please verify your key and security level.");
        }

        let lastRequestId = 0;

            const pgpPass = pgpPassphraseInput.value.trim();
            recoveryArea.classList.add('hidden');
            recoveryArea.classList.remove('flex');
            recoveryArea.innerHTML = '';

            if (!text) {
                outputArea.innerHTML = '<span class="text-gray-600 italic font-mono text-xs">Output will appear here...</span>';
                if (statusText) statusText.innerText = '';
                return;
            }

            if (currentCategory !== 'encoding' && !key) {
                outputArea.innerHTML = `<span class="text-red-400 font-mono text-xs">Please provide a ${currentCategory === 'pgp' ? 'PGP Key' : 'Secret Key'}.</span>`;
                if (statusText) statusText.innerText = '';
                return;
            }

            if (statusText) {
                statusText.className = 'text-xs text-emerald-500 font-bold uppercase tracking-widest';
                startStatusCycling();
            }

            try {
                const transformer = Transformers[algo];
                if (!transformer) throw new Error("Algorithm not implemented.");

                let result = "";
                let detectedLevel = null;
                // Handle different signatures for transformers
                if (currentCategory === 'pgp') {
                    result = await transformer.process(text, key, pgpPass);
                } else {
                    if (action === 'process') {
                        result = await transformer.process(text, key);
                    } else {
                        const rawResult = await transformer.reverse(text, key);
                        if (rawResult && typeof rawResult === 'object' && rawResult.level) {
                            result = rawResult.result;
                            detectedLevel = rawResult.level;
                        } else {
                            result = rawResult;
                        }
                    }
                }

                // Only update if this is still the latest request
                if (currentRequestId !== lastRequestId) return;

                outputArea.textContent = result;
                if (detectedLevel) {
                    const badge = document.createElement('div');
                    badge.className = 'mt-3 pt-3 border-t border-[var(--border-card)] text-[10px] text-emerald-400 font-bold uppercase tracking-widest flex items-center gap-2 opacity-80';
                    badge.innerHTML = `<svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg> Verified Security: ${detectedLevel === 'standard' ? 'Legacy/Standard' : 'Level ' + detectedLevel}`;
                    outputArea.appendChild(badge);
                }
                if (statusText) {
                    statusText.className = 'text-xs text-emerald-500 font-bold uppercase tracking-widest';
                    stopStatusCycling('Ready');
                }

            } catch (err) {
                if (currentRequestId !== lastRequestId) return;

                // Build error UI safely using textContent
                outputArea.innerHTML = '';
                const errorSpan = document.createElement('span');
                errorSpan.className = 'text-red-400 flex items-start gap-2 font-mono text-xs';
                errorSpan.innerHTML = '<svg class="w-4 h-4 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>';

                const messageSpan = document.createElement('span');

                if (err.message.includes("Misformed armored text")) {
                    messageSpan.textContent = 'Error: Misformed armor. You need to include the BEGIN/END wrapper lines.';
                    errorSpan.appendChild(messageSpan);
                    outputArea.appendChild(errorSpan);

                    recoveryArea.innerHTML = '';
                    const recoveryBtn = document.createElement('button');
                    recoveryBtn.className = 'w-fit px-4 py-2 bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-400 text-xs font-medium rounded-lg border border-emerald-500/30 transition-all uppercase tracking-wider';
                    recoveryBtn.textContent = 'Add wrapper for this action';
                    recoveryBtn.dataset.algo = algo;
                    recoveryBtn.addEventListener('click', (e) => {
                        addPgpWrapper(e.currentTarget.dataset.algo);
                    });

                    recoveryArea.appendChild(recoveryBtn);
                    recoveryArea.classList.remove('hidden');
                    recoveryArea.classList.add('flex');
                } else {
                    messageSpan.textContent = 'Error: ' + err.message;
                    errorSpan.appendChild(messageSpan);
                    outputArea.appendChild(errorSpan);
                }
                if (statusText) {
                    statusText.className = 'text-[10px] text-red-500 font-bold uppercase tracking-widest';
                    stopStatusCycling('Error');
                }
            }
        }

        async function addPgpWrapper(algo) {
            const el = document.getElementById('cryptoKey');
            const key = el.value.trim();
            if (!key) return;
            // Don't wrap if it already looks like PGP armor
            if (key.includes('-----BEGIN PGP')) return;
            let wrapped = "";
            if (algo === 'pgp-decrypt' || algo === 'pgp-sign') {
                wrapped = `-----BEGIN PGP PRIVATE KEY BLOCK-----\n\n${key}\n-----END PGP PRIVATE KEY BLOCK-----`;
            } else {
                wrapped = `-----BEGIN PGP PUBLIC KEY BLOCK-----\n\n${key}\n-----END PGP PUBLIC KEY BLOCK-----`;
            }

            el.value = wrapped;
            executeTransformation();
        }

        function togglePgpPass() {
            const btn = document.getElementById('pgpPassToggle');
            const type = pgpPassphraseInput.type === 'password' ? 'text' : 'password';
            pgpPassphraseInput.type = type;
            
            const eye = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>`;
            const eyeOff = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><path d="m15 18-.722-3.25"/><path d="M2 8a10.645 10.645 0 0 0 20 0"/><path d="m20 15-1.726-2.05"/><path d="m4 15 1.726-2.05"/><path d="m9 18 .722-3.25"/></svg>`;
            
            btn.innerHTML = type === 'password' ? eye : eyeOff;

            // Update A11y
            const label = document.querySelector('label[for="pgpPassphrase"]');
            if (label) label.innerText = `PGP PASSPHRASE (${type === 'password' ? 'HIDDEN' : 'VISIBLE'})`;
            btn.setAttribute('aria-pressed', type === 'text');
            
            // Add animation class
            const svg = btn.querySelector('svg');
            if (svg) {
                svg.classList.add('animate-icon');
                setTimeout(() => svg.classList.remove('animate-icon'), 300);
            }
        }

        // --- THEME ENGINE ---
        function toggleTheme(event) {
            const x = event.clientX;
            const y = event.clientY;
            const endRadius = Math.hypot(
                Math.max(x, innerWidth - x),
                Math.max(y, innerHeight - y)
            );

            const isTransition = !!document.startViewTransition;
            
            const performToggle = () => {
                document.documentElement.classList.toggle('light');
                const isLight = document.documentElement.classList.contains('light');
                localStorage.setItem('theme', isLight ? 'light' : 'dark');
                updateThemeIcons();
                
                // Update meta tag
                const meta = document.querySelector('meta[name="color-scheme"]');
                if (meta) meta.content = isLight ? 'light' : 'dark';
            };

            if (!isTransition) {
                performToggle();
                return;
            }

            const transition = document.startViewTransition(performToggle);

            transition.ready.then(() => {
                const clipPath = [
                    `circle(0px at ${x}px ${y}px)`,
                    `circle(${endRadius}px at ${x}px ${y}px)`,
                ];
                document.documentElement.animate(
                    {
                        clipPath: clipPath,
                    },
                    {
                        duration: 700,
                        easing: 'cubic-bezier(0.4, 0, 0.2, 1)',
                        pseudoElement: '::view-transition-new(root)',
                    }
                );
            }).catch(err => {
                console.warn('View transition was skipped or failed:', err);
            });
        }

        function updateThemeIcons() {
            const isLight = document.documentElement.classList.contains('light');
            document.getElementById('sunIcon').classList.toggle('hidden', !isLight);
            document.getElementById('moonIcon').classList.toggle('hidden', isLight);
        }

        // Redundant functions removed for consolidation.

        // --- CUSTOM DROPDOWN ENGINE ---
        function createRipple(e, parent) {
            const rect = parent.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const size = Math.max(rect.width, rect.height) * 2;
            
            const dim = document.createElement('div');
            dim.className = 'spread-ripple ripple-dim animate-ripple';
            dim.style.width = dim.style.height = `${size}px`;
            dim.style.left = `${x - size/2}px`;
            dim.style.top = `${y - size/2}px`;
            parent.appendChild(dim);
            
            setTimeout(() => {
                const clear = document.createElement('div');
                clear.className = 'spread-ripple ripple-clear animate-ripple';
                clear.style.width = clear.style.height = `${size}px`;
                clear.style.left = `${x - size/2}px`;
                clear.style.top = `${y - size/2}px`;
                parent.appendChild(clear);
                
                setTimeout(() => {
                    dim.remove();
                    clear.remove();
                }, 1000);
            }, 100);
        }

        function initializeCustomDropdowns() {
            const selects = document.querySelectorAll('select:not(.custom-init)');
            selects.forEach(select => {
                const container = document.createElement('div');
                container.className = 'dropdown-container';
                
                const trigger = document.createElement('div');
                trigger.className = 'dropdown-trigger';
                trigger.tabIndex = 0;
                
                const label = document.createElement('span');
                label.innerText = select.options[select.selectedIndex]?.text || 'Select...';
                
                const arrow = document.createElement('div');
                arrow.className = 'dropdown-arrow';
                arrow.innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M19 9l-7 7-7-7" /></svg>`;
                
                trigger.appendChild(label);
                trigger.appendChild(arrow);
                
                const optionsList = document.createElement('div');
                optionsList.className = 'dropdown-options custom-scrollbar';
                
                const syncOptions = () => {
                    optionsList.innerHTML = '';
                    Array.from(select.options).forEach((opt, idx) => {
                        const optionEl = document.createElement('div');
                        optionEl.className = 'dropdown-option' + (idx === select.selectedIndex ? ' selected' : '');
                        optionEl.innerText = opt.text;
                        optionEl.onclick = (e) => {
                            e.stopPropagation();
                            select.selectedIndex = idx;
                            select.dispatchEvent(new Event('change'));
                            label.innerText = opt.text;
                            toggleDropdown(false);
                        };
                        optionsList.appendChild(optionEl);
                    });
                };

                const toggleDropdown = (show) => {
                    if (show) {
                        syncOptions();
                        trigger.classList.add('open');
                        optionsList.classList.add('show');
                    } else {
                        trigger.classList.remove('open');
                        optionsList.classList.remove('show');
                    }
                };

                trigger.onclick = (e) => {
                    const isOpen = optionsList.classList.contains('show');
                    document.querySelectorAll('.dropdown-options').forEach(el => el.classList.remove('show'));
                    document.querySelectorAll('.dropdown-trigger').forEach(el => el.classList.remove('open'));
                    toggleDropdown(!isOpen);
                    createRipple(e, trigger);
                };

                // Observer to re-sync if original select options change (e.g. algorithm changes)
                if (select._observer) select._observer.disconnect();
                const observer = new MutationObserver(() => {
                    label.innerText = select.options[select.selectedIndex]?.text || 'Select...';
                });
                observer.observe(select, { childList: true, attributes: true });
                select._observer = observer;

                container.appendChild(trigger);
                container.appendChild(optionsList);
                select.parentNode.insertBefore(container, select);
                select.classList.add('hidden', 'custom-init');
            });
        }

        // Close on outside click
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.dropdown-container')) {
                document.querySelectorAll('.dropdown-options').forEach(el => el.classList.remove('show'));
                document.querySelectorAll('.dropdown-trigger').forEach(el => el.classList.remove('open'));
            }
        });

        // Boot
        const savedTheme = localStorage.getItem('theme');
        const systemPrefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
        const isLight = savedTheme === 'light' || (!savedTheme && systemPrefersLight);

        if (isLight) {
            document.documentElement.classList.add('light');
            const meta = document.querySelector('meta[name="color-scheme"]');
            if (meta) meta.content = 'light';
        } else {
            document.documentElement.classList.remove('light');
            const meta = document.querySelector('meta[name="color-scheme"]');
            if (meta) meta.content = 'dark';
        }
        
        init();
        
        // Restore tab states
        const savedCat = localStorage.getItem('activeCategory');
        if (savedCat) setCategory(savedCat, false);
        
        const savedPgpAlgo = localStorage.getItem('activePgpAlgo');
        const savedPgpIdx = localStorage.getItem('activePgpIdx');
        if (savedPgpAlgo && savedPgpIdx !== null) {
            setPgpAction(savedPgpAlgo, parseInt(savedPgpIdx), false);
        }

        updateThemeIcons();
        initializeCustomDropdowns();

    </script>
